# 构建 ScreenOCR.exe 并自动合并 Umi-OCR 引擎, 输出自包含的完整包。
# 仓库 Actions -> Run workflow, 完成后到运行页底部 Artifacts 下载 ScreenOCR.zip
name: build-exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 3.8 是最后一个官方支持 Win7 的 Python, 构建的 exe 才能跑在 Win7 上
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: 安装依赖
        run: |
          pip install pyautogui==0.9.54 Pillow==10.4.0 openpyxl==3.1.5 requests==2.32.3 pyinstaller==5.13.2

      - name: 打包 exe
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name ScreenOCR app/main.py

            # Download latest official Umi-OCR (Rapid engine) and bundle it into the package.
      - name: Download and bundle Umi-OCR engine
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/hiroi-sora/Umi-OCR/releases/latest" -Headers @{"User-Agent" = "ScreenOCR-build"}
          $asset = $rel.assets | Where-Object { $_.name -match "Rapid" -and $_.name -like "*.7z.exe" } | Select-Object -First 1
          if (-not $asset) { throw "no Rapid 7z.exe asset found in Umi-OCR latest release" }
          Write-Host "downloading: $($asset.name)"
          $sfx = Join-Path $env:TEMP "umi.7z.exe"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $sfx
          $out = Join-Path $env:TEMP "umi_extract"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $seven = @("C:\Program Files\7-Zip\7z.exe", "C:\Program Files (x86)\7-Zip\7z.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($seven) {
            Write-Host "method 1: 7-Zip extract with $seven"
            & $seven x "-o$out" $sfx -y | Out-Null
          }
          $umiExe = Get-ChildItem -Path $out -Recurse -Filter "Umi-OCR.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $umiExe) {
            Write-Host "method 2: run self-extracting archive"
            Push-Location $out
            & $sfx -y | Out-Null
            Pop-Location
            $umiExe = Get-ChildItem -Path $out -Recurse -Filter "Umi-OCR.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $umiExe) { throw "extract failed: Umi-OCR.exe not found in $out" }
          Copy-Item -Recurse $umiExe.DirectoryName "dist\ScreenOCR\Umi-OCR"
          Write-Host "bundled: $($umiExe.DirectoryName)"

      - name: 上传产物 (含 Umi-OCR 引擎的完整包)
        uses: actions/upload-artifact@v4
        with:
          name: ScreenOCR
          path: dist/ScreenOCR